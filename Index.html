<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Premium Broadcast Ticker</title>
    <!-- Google Fonts: Khand for bold, clean look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Khand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Khand', sans-serif;
        }

        body {
            background-color: #1a1a2e; /* Dark cinematic background */
            padding: 60px 20px;
        }

        /* Ultimate Glassmorphism Container */
        .premium-ticker-bar {
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    background: #06122b !important; /* Pure Solid Dark Blue (fika nahi hoga) */
    display: flex;
    align-items: stretch;
    height: 60px;
    border-radius: 12px; 
    border: 1px solid rgba(255, 204, 0, 0.5); /* Clear Gold Border */
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
    overflow: hidden;
}
        /* Live Section with Angled Design */
        .live-section {
            background: linear-gradient(135deg, #ff0055 0%, #990033 100%);
            color: #fff;
            display: flex;
            align-items: center;
            padding: 0 30px;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            position: relative;
            clip-path: polygon(0 0, 85% 0, 100% 100%, 0% 100%); /* Sharp modern edge */
            padding-right: 45px;
        }

        .live-section::after {
            content: '';
            width: 8px;
            height: 8px;
            background-color: #fff;
            border-radius: 50%;
            margin-left: 10px;
            display: inline-block;
            box-shadow: 0 0 10px #fff;
            animation: pulse 1.5s infinite;
        }

        /* Branding Text */
        .brand-section {
            display: flex;
            align-items: center;
            padding: 0 25px;
            color: #ffcc00;
            font-size: 1.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-right: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.2);
        }

        /* Marquee/Ticker Area */
        .ticker-body {
            flex: 1;
            overflow: hidden;
            display: flex;
            align-items: center;
            position: relative;
        }

        .scroll-text {
            display: inline-block;
            white-space: nowrap;
            color: #e2e8f0;
            font-size: 1.35rem;
            font-weight: 500;
            letter-spacing: 0.8px;
            padding-left: 100%;
            animation: modern-loop 30s linear infinite;
        }

        /* Highlighting specific text */
        .scroll-text span.highlight {
            color: #ffcc00;
            font-weight: 700;
            background: rgba(255, 204, 0, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 204, 0, 0.2);
            margin: 0 5px;
        }

        .scroll-text .divider {
            color: #ff0055;
            margin: 0 15px;
            font-weight: 700;
        }

        /* Right Side Fixed Message/Alert */
        .right-badge {
            background: #ffcc00;
            color: #0b1e42;
            display: flex;
            align-items: center;
            padding: 0 25px;
            font-size: 1.3rem;
            font-weight: 700;
            clip-path: polygon(15% 0, 100% 0, 100% 100%, 0% 100%);
            padding-left: 40px;
        }

        /* Keyframes Animations */
        @keyframes modern-loop {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.4; }
            50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 15px #fff; }
            100% { transform: scale(0.9); opacity: 0.4; }
        }
    </style>
</head>
<body>

    <!-- Ultra Premium Ticker -->
    <div class="premium-ticker-bar">
        
        <!-- 1. Modern Angled Live Badge -->
        <div class="live-section">LIVE</div>

        <!-- 2. Clean Brand Title -->
        <div class="brand-section">Gurbani Ras Live</div>

        <!-- 3. Smooth Cinematic Ticker -->
        <div class="ticker-body">
            <div class="scroll-text">
                LIVE CHANNEL TE AAP SABH SANGAT DA SWAGAT HAI <span class="divider">•</span> CHANNEL NU SUBSCRIBE KARO <span class="divider">•</span> BELL ICON DABAO <span class="divider">•</span> <span class="highlight">SATNAM SRI WAHEGURU JI</span> <span class="divider">•</span> NITNEM PATH <span class="divider">•</span> GURBANI KIRTAN <span class="divider">•</span> WAHEGURU SIMRAN <span class="divider">•</span> bhai amanjeet singh ji khalsa delhi wale...
            </div>
        </div>

        <!-- 4. Premium End Badge -->
        <div class="right-badge">
            SUBSCRIBE NOW
        </div>

    </div>

</body>
</html>
