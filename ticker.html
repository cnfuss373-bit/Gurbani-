<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gurbani Ras Live Logo</title>
<style>
body {
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  font-family: Arial, sans-serif; /* Ek saaf font ke liye */
}

.logo {
  width: 450px;
  height: 450px;
  border-radius: 50%;
  background: radial-gradient(circle, #002a7a, #000814);
  border: 8px solid #d4af37;
  box-shadow: 0 0 30px #d4af37;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: white;
  box-sizing: border-box;
}

/* Khanda ki class fixing */
.khanda {
  font-size: 90px;
  color: #ffd700;
  text-shadow: 0 0 20px gold;
  line-height: 1;
  margin-bottom: 5px;
}

.title {
  font-size: 55px;
  font-weight: 800;
  color: #ffd700;
  line-height: 1;
  letter-spacing: 2px;
}

.subtitle {
  font-size: 45px;
  font-weight: 700;
  color: white;
  line-height: 1;
  margin-top: 5px;
  letter-spacing: 1px;
}

.live {
  margin-top: 15px;
  background: red;
  padding: 6px 35px;
  border-radius: 12px;
  font-size: 30px;
  font-weight: 800;
  letter-spacing: 1px;
  box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
}

.footer {
  margin-top: 20px;
  font-size: 16px;
  color: #ffd700;
  font-weight: 600;
  line-height: 1.4;
}
</style>
</head>

<body>

<div class="logo">
  <div class="khanda">☬</div>
  <div class="title">GURBANI</div>
  <div class="subtitle">RAS</div>
  <div class="live">LIVE</div>
  <div class="footer">
    WAHEGURU JI KA KHALSA<br>
    WAHEGURU JI KI FATEH
  </div>
</div>

</body>
</html>
